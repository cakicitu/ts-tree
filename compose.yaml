services:
  padel-turnier:
    build: .
    ports:
      - "${PORT:-8080}:3000"
    environment:
      ADMIN_USERNAME: ${ADMIN_USERNAME:-admin}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-PadelTurnier}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    volumes:
      - tournament-data:/app/data
    restart: unless-stopped
    init: true
    security_opt:
      - no-new-privileges:true

volumes:
  tournament-data:
