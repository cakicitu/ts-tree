# Paste this block into the `server { ... }` that serves tuerker-cakici.de
# in /opt/homepages/nginx-homepages.conf, then run /opt/homepages/deploy-nginx.sh

    # ts-tree - Vue SPA + Node/SQLite (ts-tree.service) on 127.0.0.1:8094.
    # The trailing slash on proxy_pass strips the /ts-tree prefix, so the Node
    # server sees the same paths as when it runs at the root.
    location = /ts-tree {
        return 301 /ts-tree/;
    }

    location /ts-tree/ {
        proxy_pass http://127.0.0.1:8094/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
